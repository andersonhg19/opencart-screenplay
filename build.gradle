buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.serenity-bdd:serenity-gradle-plugin:4.3.2'
    }
}

plugins {
	id 'io.github.jumosqu12.screenplayarchitecture' version '2.0.1'
	id 'java'
    id 'eclipse'
    id 'idea'
    id 'checkstyle'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.0.18'
}

apply plugin: 'net.serenity-bdd.serenity-gradle-plugin'

group 'co.edu.udea.calidad'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.1.0'
    serenityCucumberVersion = '4.1.0'
    lombokVersion = '1.18.22'
    junit = '4.13.2'
    hamcrest = '1.3'
    serenityWebVersion = '4.1.0'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber:$rootProject.ext.serenityCucumberVersion"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$rootProject.ext.serenityWebVersion"

    //Test compilation
    testImplementation "junit:junit:$rootProject.ext.junit"
    testImplementation "org.hamcrest:hamcrest-all:$rootProject.ext.hamcrest"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    testImplementation("io.github.bonigarcia:webdrivermanager:5.4.1")

    //Lombok dependencies
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly  "org.projectlombok:lombok:${lombokVersion}"

    //Additional library
    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.12.0'

}

tasks.named('test') {
    useJUnit()
    finalizedBy aggregate
    // Propaga -D del shell al JVM del test (para filtrar por tags, etc.)
    systemProperties = System.properties.findAll { k, v ->
        k.toString().startsWith('cucumber.') || k.toString().startsWith('serenity.') || k.toString().startsWith('webdriver.')
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

// =====================================================================
// Analisis estatico - Checkstyle (convenciones)
// =====================================================================
checkstyle {
    toolVersion = '10.17.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = true          // No bloquear el build por estilo
    maxWarnings = 1000
    showViolations = true
}

// =====================================================================
// Analisis estatico - SpotBugs (bugs comunes)
// =====================================================================
spotbugs {
    toolVersion = '4.8.6'
    ignoreFailures = true          // Solo reporta, no bloquea
    effort = 'default'
    reportLevel = 'medium'
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

// =====================================================================
// Cobertura - JaCoCo
// =====================================================================
jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    sourceDirectories.setFrom(files('src/main/java', 'src/test/java'))
    classDirectories.setFrom(
        fileTree(dir: 'build/classes/java/main', exclude: ['**/exceptions/Exception.class','**/integrations/Integration.class','**/userinterfaces/UserInterface.class','**/tasks/Task.class','**/questions/Question.class','**/interactions/Interaction.class','**/models/Model.class','**/utils/Util.class']),
        fileTree(dir: 'build/classes/java/test')
    )
}

// =====================================================================
// Tarea agregada de calidad
// =====================================================================
tasks.register('qualityReports') {
    group = 'verification'
    description = 'Genera reportes de Checkstyle, SpotBugs y JaCoCo'
    dependsOn 'checkstyleMain', 'checkstyleTest', 'spotbugsMain', 'jacocoTestReport'
}
