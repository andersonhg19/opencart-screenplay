services:
  mariadb:
    image: docker.io/bitnami/mariadb:11
    container_name: opencart-mariadb
    environment:
      MARIADB_USER: bn_opencart
      MARIADB_DATABASE: bitnami_opencart
      MARIADB_PASSWORD: bn_opencart
      MARIADB_ROOT_PASSWORD: bn_opencart
      MARIADB_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mariadb_data:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  opencart:
    image: docker.io/bitnami/opencart:4
    container_name: opencart
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      OPENCART_HOST: localhost:8080
      OPENCART_DATABASE_HOST: mariadb
      OPENCART_DATABASE_PORT_NUMBER: "3306"
      OPENCART_DATABASE_USER: bn_opencart
      OPENCART_DATABASE_NAME: bitnami_opencart
      OPENCART_DATABASE_PASSWORD: bn_opencart
      OPENCART_USERNAME: admin
      OPENCART_PASSWORD: bitnami123
      OPENCART_EMAIL: admin@example.com
      ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - opencart_data:/bitnami/opencart
      - opencart_storage_data:/bitnami/opencart_storage

volumes:
  mariadb_data:
    driver: local
  opencart_data:
    driver: local
  opencart_storage_data:
    driver: local
