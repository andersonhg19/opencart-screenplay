serenity {
    take.screenshots = FOR_EACH_ACTION
    use.unique.browser = false
    restart.browser.for.each = example
    test.root = co.edu.udea.calidad.opencart
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
    project.name = "OpenCart Screenplay - Calidad de Software 2026-1"
}

#headless.mode = true

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome.switches = """--start-maximized;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-extensions;
                   --disable-infobars;--disable-gpu;
                   --remote-allow-origins=*"""

pages {
    opencartUrl = "https://tutorialsninja.com/demo/"
}
