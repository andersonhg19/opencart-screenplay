name: OpenCart Screenplay E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Screenplay tests (Chrome headless)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.14.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.2

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Force headless mode for CI
        run: |
          echo "" >> src/test/resources/serenity.conf
          echo "headless.mode = true" >> src/test/resources/serenity.conf

      - name: Run Screenplay E2E suite
        run: gradle test --no-daemon --console=plain
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      - name: Upload Serenity HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity/
          retention-days: 30

      - name: Upload Cucumber JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json
          path: target/cucumber-reports/cucumber.json
          retention-days: 14

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Results
          path: build/test-results/test/*.xml
          reporter: java-junit
